name: CI Frontend Karsajobs-UI

on:
  push:
    branches: [karsajobs-ui]
  pull_request:
    branches: [karsajobs-ui]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: Run Hadolint
        run: hadolint Dockerfile

  build-app-karsajobs-ui:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.PASSWORD_GITHUB_TOKEN }}" | docker login ghcr.io -u fajaramaulana --password-stdin

      - name: Build & Push Image
        run: |
          chmod +x build_push_image_karsajobs_ui.sh
          ./build_push_image_karsajobs_ui.sh
