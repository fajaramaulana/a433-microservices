name: CI Backend Karsajobs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Hadolint
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      - name: Run Hadolint
        run: hadolint Dockerfile

  test-app:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.16

      - name: Run Unit Tests
        run: go test -v -short --count=1 $(go list ./...)

        
  build-app-karsajobs:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, test-app]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.PASSWORD_GITHUB_TOKEN }}" | docker login ghcr.io -u fajaramaulana --password-stdin

      - name: Build & Push Image
        run: |
          chmod +x build_push_image_karsajobs.sh
          ./build_push_image_karsajobs.sh
